name: Build MinimalNav

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MinimalNav
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install make ldid

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Get Theos commit
        run: |
          echo "THEOS_COMMIT=$(git ls-remote https://github.com/roothide/theos HEAD | awk '{print substr($1,1,7)}')" >> $GITHUB_ENV

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v6
        with:
          path: theos
          key: MinimalNav-26.5-SDK-${{ env.THEOS_COMMIT }}

      - name: Setup Theos
        if: ${{ steps.cache-theos.outputs.cache-hit != 'true' }}
        run: |
          git clone --quiet --depth=1 --recurse-submodules https://github.com/roothide/theos.git
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS26.5.sdk
          git checkout --quiet
          mv *.sdk "$THEOS/sdks"

      - name: Clone YouTubeHeader
        run: |
          rm -rf "$THEOS/include/YouTubeHeader"
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"

      - name: Build
        run: |
          echo "TWEAK_VERSION=$(grep '^Version:' control | cut -d ' ' -f2)" >> $GITHUB_ENV
          # Rootful and rootless packages share the same file name (iphoneos-arm64),
          # so each scheme's package is renamed before the next build overwrites it.
          mkdir -p out
          for scheme in rootful rootless roothide; do
            if [ "$scheme" = rootful ]; then
              make clean package DEBUG=0 FINALPACKAGE=1
            else
              make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=$scheme
            fi
            for f in packages/*.deb; do mv "$f" "out/$(basename "${f%.deb}")-$scheme.deb"; done
          done
          ls -l out

      - name: Upload the tweak .deb(s)
        uses: actions/upload-artifact@v7
        with:
          name: MinimalNav v${{ env.TWEAK_VERSION }}
          path: out/*.deb
          if-no-files-found: error

      - name: Create a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: out/*.deb
          draft: true
